[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/database",
    "crates/platform",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["TraceNest contributors"]

[workspace.dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled", "backup"] }
tauri = "2"
tauri-build = "2"

# 编译加速（可选，默认不启用）
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
