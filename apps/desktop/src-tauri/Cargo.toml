[package]
name = "tracenest-desktop"
description = "FMap 桌面应用（Tauri 2 壳 + IPC 命令层）"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "tracenest_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Tauri 2 标准打包特性：启用后 cargo build 使用 tauri.conf.json 的 frontendDist
# （内嵌前端资产）而非 devUrl——release 验收/打包必需。
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
tracenest-core = { path = "../../../crates/core" }
tracenest-database = { path = "../../../crates/database" }
tracenest-platform = { path = "../../../crates/platform" }
tauri = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
